<div>
  <div class="main-picture">

    <form (ngSubmit)="login()" class="login-form"> 

        <h2> Login </h2>

        <div class="form-group">
            <label for="email">Email</label>
            <input [(ngModel)]="email" id="email" name="email" type="email" placeholder="Enter email">
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input [(ngModel)]="password" id="password" name="password" type="password" placeholder="Enter password">
        </div>

        <button type="submit" class="btn login-btn">Login</button>

    </form>


  </div>
</div>
