<div class="main-picture">

  <div class="shop-card">

    <div class="shop-header">

      <h1>Shop</h1>

      <div class="shop-filters">

        <div class="filters-left">

          <input
            type="text"
            placeholder="Search products..."
            (input)="onSearch($event)"
          >

          <select (change)="onCategoryChange($event)">
            <option value="">All Categories</option>
            <option value="Protein">Protein</option>
            <option value="Creatine">Creatine</option>
            <option value="PreWorkout">Pre Workout</option>
          </select>

          <select (change)="onSortChange($event)">
            <option value="">Sort By</option>
            <option value="priceAsc">Price Low</option>
            <option value="priceDesc">Price High</option>
          </select>
        </div>

        @if(isAdmin()) {

          <div class="filters-right">
            <button routerLink="/unlisted"> View Unlisted Products </button>
            <button (click)="isOpen = true"> Add Product </button>
          </div>
        } 

      </div>

    </div>

    <div class="products-container">

      @for(product of productss(); track product.id) {

        <app-product-card
          [product]="product"
          (selected)="goToProduct($event)">
        </app-product-card>

      }

      <!-- @for(product of products; track product.id) {

        <app-product-card
          [product]="product"
          (selected)="goToProduct($event)">
        </app-product-card>
      
      } -->

    </div>

  </div>

  @if(isOpen) {

    <div class="shop-add">

      <form class="shop-form" [formGroup]="shopForm" (ngSubmit)="createProduct()">

        <label>
          Name
          <input type="text" name="name" placeholder="name" 
          formControlName="name">
        </label>

        <label>
          Description
          <input type="text" name="description" placeholder="description" 
          formControlName="description">
        </label>

        <label>
          Short Description
          <input type="text" name="shortDescription" placeholder="Shop Description" 
          formControlName="shortDescription">
        </label>

        <label>
          Price
          <input type="number" name="price" placeholder="price" 
          formControlName="price">
        </label>

        <label>
          In Stock
          <input type="checkbox" formControlName="stock">
        </label>

        <label>
          List Product
          <input type="checkbox" formControlName="listed">
        </label>

        <label>
          Category
          <input type="text" name="category" placeholder="category" 
          formControlName="category">
        </label>

        <label>
          Product Image
          <input type="file" accept="image/*" multiple (change)="onFileSelected($event)">
        </label>
        

        <div class="form-shop-update">
          <button type="button" (click)="isOpen = false"> Close </button>
          <button type="submit"> Submit </button>
        </div>

      </form>

    </div>

  }

</div>
