<div class="main-picture">

  <div class="shop-card">

    <div class="shop-header">

      <h1>Shop</h1>

      <div class="shop-filters">

        <input
          type="text"
          placeholder="Search products..."
        >

        <select>
          <option>All Categories</option>
          <option>Protein</option>
          <option>Creatine</option>
          <option>Pre Workout</option>
        </select>

        <select>
          <option>Sort By</option>
          <option>Price Low</option>
          <option>Price High</option>
        </select>

        @if(isAdmin()) {
          <button class="add-prod" (click)="isOpen = true"> Add Product </button>
        } 

      </div>

    </div>

    <div class="products-container">

      @for(product of productss(); track product.id) {

        <app-product-card
          [product]="product"
          (selected)="goToProduct($event)">
        </app-product-card>

      }

      @for(product of products; track product.id) {

        <app-product-card
          [product]="product"
          (selected)="goToProduct($event)">
        </app-product-card>
      
      }

    </div>

  </div>

  @if(isOpen) {

    <div class="shop-add">

      <form class="shop-form" [formGroup]="shopForm" (ngSubmit)="createProduct()">

        <label>
          Name
          <input type="text" name="name" placeholder="name" 
          formControlName="name">
        </label>

        <label>
          Description
          <input type="text" name="description" placeholder="description" 
          formControlName="description">
        </label>

        <label>
          Short Description
          <input type="text" name="shortDescription" placeholder="Shop Description" 
          formControlName="shortDescription">
        </label>

        <label>
          Price
          <input type="number" name="price" placeholder="price" 
          formControlName="price">
        </label>

        <label>
          In Stock
          <input type="checkbox" formControlName="stock">
        </label>

        <label>
          Category
          <input type="text" name="category" placeholder="category" 
          formControlName="category">
        </label>

        @for(images of images.controls; track $index) {

          <div formArrayName="images">
            <input type="file" placeholder="Image URL" [formControlName]="$index">
            <button type="button" (click)="removeImage($index)">Remove</button>
          </div>

        }

        <div class="form-shop-update">
          <button type="button" (click)="addImages()">Add Image</button>
          <button type="button" (click)="isOpen = false"> Close </button>
          <button type="submit"> Submit </button>
        </div>

      </form>

    </div>

  }

</div>
