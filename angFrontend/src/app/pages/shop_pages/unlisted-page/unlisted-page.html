<div class="main-picture">

    <div class="unlisted-card">

        <div class="unlisted-filters"> 

            <h1> Manage your products </h1>

            <div class="unlisted-search">
                <input
                type="text"
                placeholder="Search products..."
                (input)="onSearch($event)"
                >

                <button class="unlisted-butt" routerLink="/shop">Shop</button>
                
            </div>

        </div>

        <div class="products-container">

            @for(product of products(); track product.id) {

                <app-product-card
                    [product]="product"
                    [isAdminView]="true"
                    (selected)="goToProduct($event)">
                </app-product-card>

            }

        </div>

    </div>

</div>
