<div class="main-picture">
    <div class="exercise-layout">

        <div class="exercise-header">

            <h1>Exercises Catalogue</h1>

            <div class="exercise-search">

                <input
                    type="text"
                    placeholder="Search exercises..."
                >

                <button>
                    Search
                </button>

            </div>

        </div>

        <div class="exercise-content">

            <aside class="exercise-filters">

                <h3>Filters</h3>

                <select>
                    <option>All Types</option>
                    <option>Chest</option>
                    <option>Back</option>
                    <option>Legs</option>
                    <option>Shoulders</option>
                    <option>Arms</option>
                </select>

                <select>
                    <option>Difficulty</option>
                    <option>Beginner</option>
                    <option>Intermediate</option>
                    <option>Advanced</option>
                </select>

            </aside>

            <section class="exercise-list">

                <div class="exercise-card">

                    <h3>Bench Press</h3>

                    <span class="exercise-type">
                        Chest
                    </span>

                    <p>
                        Compound exercise focused on chest development.
                    </p>

                    <button>
                        Add To Plan
                    </button>

                </div>

                <div class="exercise-card">

                    <h3>Pull Ups</h3>

                    <span class="exercise-type">
                        Back
                    </span>

                    <p>
                        Excellent exercise for upper body strength.
                    </p>

                    <button>
                        Add To Plan
                    </button>

                </div>

                <div class="exercise-card">

                    <h3>Squats</h3>

                    <span class="exercise-type">
                        Legs
                    </span>

                    <p>
                        Fundamental lower body compound movement.
                    </p>

                    <button>
                        Add To Plan
                    </button>

                </div>

            </section>

        </div>

    </div>
</div>
