<div>
  <div class="main-picture">

    <div class="dashboard">
        
        <div class="lower-dash">

            <div class="plans-section card-t">
                <h2>Your Plans</h2>

                <div class="plans-container">

                    @for(plan of plans; track $index) {
                        <div class="plan-card">{{ plan.name }}<br><span>{{ plan.type }} kcal</span></div>
                    }

                    <!-- <div class="plan-card">Clean Bulk<br><span>3000 kcal</span></div>
                    <div class="plan-card">Cut<br><span>2200 kcal</span></div>
                    <div class="plan-card">Maintenance<br><span>2600 kcal</span></div> -->
                </div>


            </div>

            <div class="profile-section card-t">

                <h2>Account Info</h2>

                <div class="profile-info">
                    <p><span class="label">Name</span><span class="value">John Doe</span></p>
                    <p><span class="label">Email</span><span class="value">john.doe@example.com</span></p>
                    <p><span class="label">Goal</span><span class="value">Muscle Gain</span></p>
                    <p><span class="label">Member Since</span><span class="value">2024</span></p>
                </div>

                <div class="account-stats">
                    <div class="stat">
                        <span class="stat-value">3</span>
                        <span class="stat-label">Plans</span>
                    </div>
                </div>

            </div>

        </div>

    </div>

  </div>
</div>
