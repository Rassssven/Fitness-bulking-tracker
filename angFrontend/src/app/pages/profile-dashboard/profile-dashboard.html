<div>
  <div class="main-picture">

    <div class="dashboard">
        
        <div class="lower-dash">

            <div class="plans-section card-t">
                <h2>Your Plans</h2>

                <div class="plans-container">

                    @for(plan of plans(); track plan.id) {
                        <div class="plan-card" (click)="goToPlan(plan.id)">{{ plan.name }}<br><span>{{ plan.type }} kcal</span></div>
                    }

                    <!-- <div class="plan-card">Clean Bulk<br><span>3000 kcal</span></div>
                    <div class="plan-card">Cut<br><span>2200 kcal</span></div>
                    <div class="plan-card">Maintenance<br><span>2600 kcal</span></div> -->
                </div>


            </div>

            <div class="profile-section card-t">

                <h2>Account Info</h2>

                <div class="profile-info">
                    <p><span class="label">Name</span><span class="value">John Doe</span></p>
                    <p><span class="label">Email</span><span class="value">john.doe@example.com</span></p>
                    <p><span class="label">Age</span><span class="value">{{ currentUser.age }}</span></p>
                    <p><span class="label">Activity Level</span><span class="value">Moderate</span></p>
                </div>

                <div class="account-stats">
                    <div class="stat">
                        <span class="stat-value">{{ plans().length }}</span>
                        <span class="stat-label">Plans</span>
                    </div>
                </div>

            </div>

        </div>

        <div class="update-profile">

            <button (click)="updateInfo()" class="btn update-btn">Update Info</button>

            <div class="prof-update">

                <div class="up-field">
                    <label for="age"> Age </label>
                    <input id="age" name="age" type="number" placeholder="Enter age" [(ngModel)]="userData.age">
                </div>
                
                <div class="up-field">
                    <label for="weight"> Weight </label>
                    <input id="weight" name="weight" type="number" placeholder="Enter weight" [(ngModel)]="userData.weight">
                </div>

                <div class="up-field">
                    <label for="height"> Height </label>
                    <input id="height" name="height" type="number" placeholder="Enter height" [(ngModel)]="userData.height">
                </div>

                <div class="up-field">
                    <label for="activity-level"> Activity Level </label>
                    <select id="activity-level" name="activity-level" [(ngModel)]="userData.activityLevel">
                        <option value="Sedentary">Sedentary</option>
                        <option value="Light">Light</option>
                        <option value="Moderate">Moderate</option>
                        <option value="Active">High</option>
                    </select>
                </div>
            </div>

        </div>

    </div>

  </div>
</div>
