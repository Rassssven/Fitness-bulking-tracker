<div>
    
    <div class="main-picture">
        <div class="main-text">
            <h1 class="main-title">
                BULK-CALCULATOR
            </h1>

            <p class="main-subtitle">
                Calculate your clean bulk / cut calories instantly
            </p>
        </div>

        <kendo-gridlayout
            [cols]="['1fr', '1fr', '1fr', '1fr']"
            rowHeight="auto"
            [gap]="24"
            class="gym-grid"
            >

            @for (option of gymOptions; track option.title) {
                <kendo-card class="wlcm-card">

                <kendo-card-header class="wlcm-card-header">
                    <h3 kendoCardTitle class="wlcm-card-title">
                    {{ option.title }}
                    </h3>
                </kendo-card-header>

                <kendo-card-body class="wlcm-card-body">
                    <div class="wlcm-card-metric">
                    <span class="wlcm-card-label">Goal</span>
                    <span class="wlcm-card-value">{{ option.description }}</span>
                    </div>

                    <div class="wlcm-card-metric wlcm-card-metric-hover">
                    <span class="wlcm-card-label">Calories</span>
                    <span class="wlcm-card-value">{{ option.calories }}</span>
                    </div>

                    <div class="wlcm-card-metric">
                    <span class="wlcm-card-label">Difficulty</span>
                    <span class="wlcm-card-value">{{ option.difficulty }}</span>
                    </div>
                </kendo-card-body>

                <kendo-card-footer class="wlcm-card-footer">
                    <button
                    kendoButton
                    themeColor="primary"
                    fillMode="solid"
                    rounded="medium"
                    (click) = "goToCalc(option.key)"
                    >
                    Select
                    </button>
                </kendo-card-footer>

                </kendo-card>
            }
        </kendo-gridlayout>

        <div class="info-part">

            <app-info-card>

                <h3 modal-title> Custom plans </h3>

                <p modal-body> Create personalized workout plans. </p>

            </app-info-card>

        </div>


    </div>

</div>
