<div>
    
    <div class="main-picture">
        <div class="main-text">
            <h1 class="main-title">
                BULK-CALCULATOR
            </h1>

            <p class="main-subtitle">
                Calculate your clean bulk / cut calories instantly
            </p>
        </div>

        <div class="gym-grid">
            @for (option of gymOptions; track option.title) {
                <div class="gym-table-card">

                <div class="table-header">
                    {{ option.title }}
                </div>

                <div class="table-content">
                    <div class="table-row">
                    <span class="label">Goal</span>
                    <span class="value">{{ option.description }}</span>
                    </div>

                    <div class="table-row">
                    <span class="label">Calories</span>
                    <span class="value highlight">{{ option.calories }}</span>
                    </div>

                    <div class="table-row">
                    <span class="label">Difficulty</span>
                    <span class="value">{{ option.difficulty }}</span>
                    </div>
                </div>

                <div class="table-footer">
                    <button kendoButton themeColor="primary">
                    Select
                    </button>
                </div>

                </div>
            }
        </div>
    </div>

</div>
