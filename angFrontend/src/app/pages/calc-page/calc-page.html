<div>
  <div class="main-picture">
    <div class="main-text">

      <form class="calc-form" (ngSubmit)="goToResult();">

        <h2>Calorie Calculator</h2>

        <div class="form-group">
          <label for="plan">Plan</label>
            <select id="plan" name="plan" [(ngModel)]="calcData.plan">
                <option value="bulk">Bulk</option>
                <option value="cut">Cut</option>
                <option value="maintenance">Maintenance</option>
                <option value="custom">Custom</option>
            </select>
        </div>

        <div class="form-group">
          <label for="weight">Current Weight (kg)</label>
          <input id="weight" name="weight" type="number" placeholder="Enter weight" [(ngModel)]="calcData.weight">
        </div>

        <div class="form-group">
          <label for="targetWeight">Target Weight (kg)</label>
          <input id="targetWeight" name="targetWeight" type="number" placeholder="Enter target weight" [(ngModel)]="calcData.targetWeight">
        </div>

        <div class="form-group">
          <label for="duration">Duration (weeks)</label>
          <input id="duration" name="duration" type="number" placeholder="Enter duration" [(ngModel)]="calcData.duration">
        </div>

        <button type="submit">Calculate</button>

      </form>

    </div>
  </div>
</div>
