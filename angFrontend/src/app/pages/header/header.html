<header class="header">

    <div class="h-left">
        <button routerLink="/"> Home </button>
        <button routerLink="/shop"> Shop </button>
        <button routerLink="/help"> Help </button>

        <button routerLink="/catalogue"> Catalogue </button>

        <button routerLink="/admin"> Admin Dashboard </button>
        @if(isLoggedIn() && isAdmin()) {
            <button routerLink="/admin"> Admin Dashboard </button>
        }
    </div>

    <div class="h-right">

        <button routerLink="/saved">Saved</button>

        @if(isLoggedIn()) {
            <button routerLink="/daily-tracker">Daily Tracker</button>
            <button routerLink="/profile-dashboard">Profile</button>
            <button routerLink="/" (click)="logout()">Logout</button>
        } @else {
            <button routerLink="/login">Log in</button>
            <button routerLink="/register">Sign up</button>
        }

    </div>

</header>
