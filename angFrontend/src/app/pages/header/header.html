<header class="header">

    <div class="h-left">
        <button routerLink="/"> Home </button>
        <button routerLink="/shop"> Shop </button>
        <button routerLink="/help"> Help </button>
        <button routerLink="/diagram"> Diagram </button>
        <div> Welcome, {{ currentUser()?.firstName }} </div>
    </div>

    <div class="h-right">

        @if(isLoggedIn()) {
            <button routerLink="/profile-dashboard">Profile</button>
            <button routerLink="/" (click)="logout()">Logout</button>
        } @else {
            <button routerLink="/login">Log in</button>
            <button routerLink="/register">Sign up</button>
        }
    
    </div>

</header>
