@if(product) {
<div class="product-page">

  <div class="product-info">
    <img [src]="product.image" [alt]="product.name">

    <div class="details">
      <h1>{{product.name}}</h1>
      <p class="price">{{product.price}}</p>
      <p class="description">
        {{ product.description }}
      </p>
    </div>
    
  </div>

  <div class="reviews">
    <h2>Reviews</h2>

    <div class="review">
      <p class="author">John</p>
      <p>Very good product!</p>
    </div>

    <div class="review">
      <p class="author">Maria</p>
      <p>I recommend it.</p>
    </div>
  </div>

</div>
}
